name: build-and-release-windows

# On every push to main: build the Windows exe and ship it as a release.
# Tag = pubspec version; the same tag's release is overwritten each build so
# the "latest" link always points at the newest artifact without accumulating
# v0.2.0+3 / v0.2.0+3 / ... tags.
on:
  push:
    branches: [main]

permissions:
  contents: write # create/overwrite releases + tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows exe
        run: flutter build windows --release

      - name: Create or overwrite release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content pubspec.yaml | Select-String '^version:').ToString().Split(' ')[1].Trim()
          $tag = "v$version"
          $exe = Get-ChildItem build/windows/x64/runner/Release/kharcha.exe
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag $exe.FullName `
            --title $tag `
            --notes "Auto-built Windows exe — commit `$GITHUB_SHA`." `
            --latest
