name: build-and-release

# On every push to main: build the arm64-v8a APK and ship it as a release.
# Tag = pubspec version; the same tag's release is overwritten each build so
# the "latest" link always points at the newest artifact without accumulating
# v0.1.1+2 / v0.1.1+2 / ... tags.
on:
  push:
    branches: [main]

permissions:
  contents: write # create/overwrite releases + tags

jobs:
  build:
    runs-on: ubuntu-latest # 7 GB RAM — max available on GitHub free tier
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Build arm64-v8a APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Create or overwrite release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d ' \r')"
          TAG="v${VERSION}"
          APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "Auto-built arm64-v8a APK — commit \`$GITHUB_SHA\`." \
            --latest
