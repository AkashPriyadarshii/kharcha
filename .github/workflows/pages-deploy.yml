# Deploys the marketing site (site/) to GitHub Pages on every push to main.
# Renders at https://AkashPriyadarshii.github.io/kharcha/
# First-party GitHub Pages workflow — enables Pages automatically on first run.

name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage site + screenshots
        run: |
          cp -r site site-staged
          cp -r screenshots site-staged/screenshots

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-staged

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
