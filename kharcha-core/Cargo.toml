[package]
name = "kharcha-core"
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/AkashPriyadarshii/kharcha-core"
description = "Deterministic core of the Kharcha UPI expense tracker: SMS parsing, spam rejection, categorization, money math, dedupe. Rule-based, no AI."
keywords = ["upi", "sms", "parser", "fintech", "uniffi"]

[lib]
name = "kharcha_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "demo"
path = "src/bin/demo.rs"

[dependencies]
fancy-regex = "0.14"
regex = "1.10"
uniffi = "0.32.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
